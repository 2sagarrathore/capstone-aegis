[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-scanner"
version = "1.0.0"
description = "Container image vulnerability scanner with CI gating, reporting and historical tracking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
    "prometheus-client>=0.20",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["reporting/templates/*.j2", "dashboard_templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
