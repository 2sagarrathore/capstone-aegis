global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The dashboard exposes the current state of every tracked image, so Prometheus
  # keeps seeing the data even when no CI job is running.
  - job_name: aegis
    metrics_path: /metrics
    static_configs:
      - targets: ["dashboard:8080"]

  # Optional: CI jobs that push per-build metrics instead of writing a textfile.
  # - job_name: aegis-pushgateway
  #   honor_labels: true
  #   static_configs:
  #     - targets: ["pushgateway:9091"]
